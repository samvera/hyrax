name: Chart Test
run-name: Chart Test of ${{ github.ref_name }} by @${{ github.actor }}
on:
  push:
    branches:
      - main
    paths:
      - "chart/**"
  pull_request:
    branches:
      - main
    paths:
      - "chart/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5

      - uses: helm/chart-testing-action@v2.8.0

      # fits is a plain HTTP chart repo (the others are oci://, which don't need this); helm's dependency resolution requires all non-OCI deps pre-registered.
      - name: Add fits chart repo
        run: helm repo add fits https://samvera-labs.github.io/fits-charts

      - name: Build chart dependencies
        run: helm dependency update chart/hyrax

      - name: Run ct lint
        run: ct lint --chart-dirs chart --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run helm unittest
        run: helm unittest chart/hyrax

      - uses: docker/setup-buildx-action@v4

      - name: Build hyrax-nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          target: hyrax-nginx
          load: true
          tags: hyrax-nginx:ci-test
          cache-from: type=gha
          cache-to: type=gha, mode=max

      # Render the real server block ConfigMap (fullnameOverride gives the upstream a resolvable
      # host) and validate it with a real nginx binary, mounted the same way the chart mounts it.
      - name: nginx -t (nginx.conf + server block)
        run: |
          mkdir -p /tmp/server_blocks
          helm template myrelease chart/hyrax --set nginx.enabled=true --set fullnameOverride=localhost \
            --show-only templates/nginx-server-block-configmap.yaml \
            | yq '.data."server-block.conf"' > /tmp/server_blocks/server-block.conf
          docker run --rm \
            -v /tmp/server_blocks/server-block.conf:/opt/bitnami/nginx/conf/server_blocks/server-block.conf:ro \
            hyrax-nginx:ci-test nginx -t
