# Default values for hyrax.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/samvera/hyrax/dassie
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# use true to skip loading Hyrax engine database seed file
skipHyraxEngineSeed: false
# use true to skip running the `db-setup` initContainer
# this may be desirable for downstream chart users to customize their database setup
skipDbMigrateSeed: false

# use false to skip the configset management init container
loadSolrConfigSet: true
# the host and auth details for an external solr service;
#   ignored if `solr.enabled` is true
solrExistingSecret: ""
externalSolrHost: ""
externalSolrPort: ""
externalSolrUser: ""
externalSolrPassword: ""
externalSolrCollection: "hyrax"

# additional environment variables, evaluated as a template. e.g.
#
#  extraEnvVars:
#    - name: RAILS_SERVE_STATIC_FILES
#      value: "1"
#    - name: GOOGLE_OAUTH_APP_NAME
#      value: "my_hyrax_app"
extraEnvVars: []

## Extra init containers
## Example
##
## extraInitContainers:
##   - name: do-something
##     image: busybox
##     command: ['echo', 'Hello, Hyrax.']
##
extraInitContainers: []

# Extra envFrom (secrets/configmaps)
# Example
#
# extraEnvFrom:
#   - configMapRef:
#       name: existingConfigMap
#   - secretRef:
#       name: existingSecret
#
extraEnvFrom: []

# Extra container spec configuration
# Example: (enabling pry debugging for local development)
# Note: with this enabled, one can `kubectl attach` to a running container with a binding.pry breakpoint
#
# extraContainerConfiguration:
# stdin: true
# tty: true
extraContainerConfiguration: []

## @param extraDeploy Array of extra objects to deploy with the release (evaluated as a template)
##
extraDeploy: []

# an existing volume containing a Hyrax-based application
# must be a ReadWriteMany volume if worker is enabled
applicationExistingClaim: ""

brandingVolume:
  enabled: true
  # the name of an existing volume claim; must be an ReadWriteMany volume
  existingClaim: ""
  size: 2Gi
  storageClass: ""

derivativesVolume:
  enabled: true
  # the name of an existing volume claim; must be an ReadWriteMany volume
  existingClaim: ""
  size: 10Gi
  storageClass: ""

uploadsVolume:
  enabled: true
  # the name of an existing volume claim; must be an ReadWriteMany volume
  existingClaim: ""
  size: 20Gi
  storageClass: ""

# additional volumes and volume mounts, evaluated as a template, e.g.
#
#  extraVolumeMounts
#    - name: local-app
#      mountPath: /app/samvera/hyrax-webapp
#  extraVolumes:
#    - name: local-app
#      hostPath:
#        path: /src
#        type: DirectoryOrCreate
extraVolumeMounts: []
extraVolumes: []

# configuration for an external/existing fcrepo service;
#   ignored if `fcrepo.enabled` is true
externalFcrepoHost: ""
fcrepoBasePathOverride: ""

# database configuration for an external postgresql;
#   ignored if `postgresql.enabled` is true
externalPostgresql: {}
#  username:
#  password:
#  database:
#  port:

embargoRelease:
  enabled: true
  schedule: "0 0 * * *"
leaseRelease:
  enabled: true
  schedule: "0 0 * * *"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: hyrax.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

livenessProbe:
  enabled: true
  # path: "/healthz"
  # initialDelaySeconds: 0
  # periodSeconds: 10
  # timeoutSeconds: 10
  # failureThreshold: 3
  # successThreshold: 1

readinessProbe:
  enabled: true
  # path: "/healthz"
  # initialDelaySeconds: 5
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 6
  # successThreshold: 1

# consider enabling if you are experiencing slow startup times
startupProbe:
  enabled: false
  # path: "/healthz"
  # initialDelaySeconds: 30
  # periodSeconds: 30
  # timeoutSeconds: 5
  # failureThreshold: 3
  # successThreshold: 1

resources: {}

worker:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/samvera/hyrax/dassie-worker
    pullPolicy: IfNotPresent
    tag: ""
  extraInitContainers: []
  extraVolumeMounts: []
  extraVolumes: []
  imagePullSecrets: []
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}

  # see: https://github.com/mperham/sidekiq/wiki/Kubernetes#health-checks
  readinessProbe:
    enabled: false
    # command:
    #  - cat
    #  - /app/samvera/hyrax-webapp/tmp/sidekiq_process_has_started_and_will_begin_processing_jobs
    # initialDelaySeconds: 10
    # periodSeconds: 2
    # timeoutSeconds: 1
    # failureThreshold: 10
    # successThreshold: 2

fcrepo:
  enabled: true
  servicePort: 8080
  postgresql:
    enabled: false
    image:
      repository: bitnamilegacy/postgresql
      tag: 12.17.0-debian-11-r28

# configuration for an external/existing fits service;
#   ignored if `fits.enabled` is true
externalFits:
  enabled: false
  url: ""  # existing FITS servlet endpoint

fits:
  enabled: true
  servicePort: 8080
  subPath: /fits

memcached:
  enabled: false
  image:
    repository: bitnamilegacy/memcached
    tag: 1.6.15-debian-11-r12

minio:
  enabled: false
  image:
    repository: bitnamilegacy/minio
    tag: 2022.7.4-debian-11-r0
  auth:
    rootUser: hyrax-access-key
    rootPassword: hyrax-secret-key
  persistence:
    enabled: false
  # defaultBuckets: bucketOne;bucketTwo

postgresql:
  enabled: true
  # ActiveRecord pool size in DATABASE_URL's ?pool= (also applies to externalPostgresql).
  # Blank/non-numeric omits it, letting database.yml's pool: win instead.
  pool: 5
  image:
    repository: bitnamilegacy/postgresql
    tag: 12.11.0-debian-11-r12
  auth:
    database: hyrax
    password: hyrax_pass
    username: hyrax
  containerPorts:
    postgresql: 5432
  primary:
    service:
      ports:
        postgresql: 5432
  readReplicas:
    service:
      ports:
        postgresql: 5432

## Nginx proxy is used to keep puma from having to serve static assets
## and to act as an auth proxy for Cantelope
nginx:
  enabled: false
  image:
    registry: ghcr.io
    repository: samvera/hyrax/hyrax-nginx
    pullPolicy: IfNotPresent
    # no Chart.AppVersion fallback here (unlike image.tag above); keep in sync with appVersion.
    tag: "5.2.0"
  # this needs to be set since templates/ingress.yaml tries to
  # evaluate .Values.nginx.service.port, and it needs to at least evaluate to
  # nil, rather than throw an error (which it does if `service` itself is nil).
  # you can change to NodePort or LoadBalancer if direct access is needed.
  # ClusterIP is used as we assume an ingress is in place.
  service:
    type: ClusterIP
    port: 80
  # Mounts volumes to allow nginx to serve assets and other public directory items
  extraVolumes:
    - name: "uploads"
      persistentVolumeClaim:
        # inlined hyrax.fullname (.Chart.Name is "nginx" here, not "hyrax"); set global.hyraxFullnameOverride to match nameOverride/fullnameOverride.
        claimName: '{{ .Values.global.hyraxFullnameOverride | default (ternary .Release.Name (printf "%s-hyrax" .Release.Name) (contains "hyrax" .Release.Name)) }}-uploads'
  extraVolumeMounts:
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/system
      subPath: public-system
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/uploads
      subPath: public-uploads
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/uv
      subPath: public-uv
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/assets
      subPath: public-assets
  # sane default at files/nginx/server-block.conf; set serverBlock directly to override its content (rendered via templates/nginx-server-block-configmap.yaml either way)
  serverBlock: ""
  # inlined hyrax.fullname (.Chart.Name is "nginx" here, not "hyrax"); set global.hyraxFullnameOverride to match nameOverride/fullnameOverride.
  existingServerBlockConfigmap: '{{ .Values.global.hyraxFullnameOverride | default (ternary .Release.Name (printf "%s-hyrax" .Release.Name) (contains "hyrax" .Release.Name)) }}-nginx-server-block'
  # Additive config appended inside the default server block (e.g. extra location blocks); ignored when serverBlock is set directly.
  extraServerBlockConfig: ""

redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: 7.0.2-debian-11-r7
  auth:
    password: mysecret

solr:
  enabled: true
  image:
    repository: bitnamilegacy/solr
    tag: 8.11.2-debian-11-r4
  containerPorts:
    http: 8983
  auth:
    enabled: true
    adminUsername: admin
    adminPassword: admin
  coreNames: hyrax
  collection: hyrax
  cloudBootstrap: true
  cloudEnabled: true
  persistence:
    enabled: true
  zookeeper:
    enabled: true
    image:
      repository: bitnamilegacy/zookeeper
      tag: 3.8.2-debian-11-r9
    persistence:
      enabled: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

global:
  # Set to match nameOverride/fullnameOverride so nginx's uploads mount stays in sync (it can't reach hyrax.fullname).
  hyraxFullnameOverride: ""
  # These global postgresql values are used by the fcrepo chart
  postgresql:
    auth:
      username: hyrax
      password: hyrax_pass
  # This is th name of the running rails server pod
  hyraxHostName: hyrax

nodeSelector: {}

tolerations: []

affinity: {}
