suite: nginx sane defaults (own templates, no vendored subchart)
templates:
  - templates/nginx-deployment.yaml
tests:
  - it: renders a resolvable image reference
    set:
      nginx.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginxinc/nginx-unprivileged:1.29-alpine

  - it: mounts the actual uploads PVC (hyrax.fullname-uploads)
    set:
      nginx.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-hyrax-uploads
