suite: nginx sane defaults (own templates, no vendored subchart)
templates:
  - templates/nginx-deployment.yaml
tests:
  - it: builds the image reference from repository and tag
    set:
      nginx.enabled: true
      nginx.image.repository: test-repo
      nginx.image.tag: test-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repo:test-tag

  - it: mounts the actual uploads PVC (hyrax.fullname-uploads)
    set:
      nginx.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: uploads
            persistentVolumeClaim:
              claimName: RELEASE-NAME-hyrax-uploads
