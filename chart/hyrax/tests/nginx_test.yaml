suite: nginx sane defaults (values.yaml nginx block)
templates:
  - charts/nginx/templates/deployment.yaml
tests:
  - it: renders a resolvable image reference (no blank tag)
    set:
      nginx.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/samvera/hyrax/hyrax-nginx:.+$

  - it: nginx's uploads claimName matches the actual uploads PVC name (hyrax.fullname-uploads)
    set:
      nginx.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: uploads
            persistentVolumeClaim:
              claimName: RELEASE-NAME-hyrax-uploads

  - it: stays in sync with the uploads PVC when global.hyraxFullnameOverride is set
    set:
      nginx.enabled: true
      global.hyraxFullnameOverride: custom-name
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: uploads
            persistentVolumeClaim:
              claimName: custom-name-uploads

  - it: mounts the sane-default server block ConfigMap (existingServerBlockConfigmap)
    set:
      nginx.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-server-block
            configMap:
              name: RELEASE-NAME-hyrax-nginx-server-block
