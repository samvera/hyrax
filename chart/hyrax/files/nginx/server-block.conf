upstream rails_app {
  server {{ include "hyrax.fullname" . }};
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /app/samvera/hyrax-webapp/public;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_body_in_file_only clean;
    client_body_buffer_size 32K;
    client_max_body_size 0;

    sendfile on;
    send_timeout 300s;

    {{ tpl .Values.nginx.extraServerBlockConfig . }}

    location ~ (\.php|\.aspx|\.asp) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^.+\.(rb|log)$ {
        deny all;
    }

    location ~ ^/(assets|packs|fonts|images|javascripts|stylesheets|swfs|system|uv|clover|clover-iiif|pdf\.js)/ {
        try_files $uri @rails;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
        add_header Last-Modified "";
        add_header ETag "";
        break;
    }

    location ~ ^/(uploads|downloads|importers|exporters|single_use_link)(/|$) {
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://rails_app;
    }

    location / {
        try_files $uri @rails;
    }

    location @rails {
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_pass http://rails_app;
    }
}
