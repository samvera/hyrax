upstream rails_app {
  server {{ include "hyrax.fullname" . }};
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /app/samvera/hyrax-webapp/public;

    access_log /var/log/nginx/access.log{{ with .Values.nginx.accessLogFormat }} {{ . }}{{ end }};
    error_log /var/log/nginx/error.log warn;

    client_body_in_file_only clean;
    client_body_buffer_size 32K;
    client_max_body_size 0;

    sendfile on;
    send_timeout 300s;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    {{ tpl .Values.nginx.extraServerBlockConfig . }}

    location ~ (\.php|\.aspx|\.asp) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^.+\.(rb|log)$ {
        deny all;
    }

    location ~ ^/(assets|packs|fonts|images|javascripts|stylesheets|swfs|system|uv|clover|clover-iiif|pdf\.js)/ {
        try_files $uri @rails;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
        add_header Last-Modified "";
        add_header ETag "";
        break;
    }

    location ~ ^/(uploads|downloads|importers|exporters|single_use_link)(/|$) {
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://rails_app;
    }

    # work/collection/show pages and catalog search can legitimately take longer than @rails' 60s default under load
    location ~ ^/(concern|catalog)(/|$) {
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_pass http://rails_app;
    }

    location / {
        try_files $uri @rails;
    }

    location @rails {
        proxy_pass http://rails_app;
    }
}
