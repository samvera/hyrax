{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyrax.nginx.host" . }}
  labels:
    {{- include "hyrax.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hyrax.nginxSelectorLabels" . | nindent 4 }}
{{- end }}
